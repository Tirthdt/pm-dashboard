<section class="my-3 p-3 mx-3">
  @if (projectService.loading()) {
  <p-table [value]="skeleton">
    <ng-template #caption>
      <div class="flex items-center justify-between">
        <span class="text-xl font-bold">Projects</span>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th>Project Name</th>
        <th>Status</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Progress</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr height="50px">
        <td><p-skeleton></p-skeleton></td>
        <td><p-skeleton></p-skeleton></td>
        <td><p-skeleton></p-skeleton></td>
        <td><p-skeleton></p-skeleton></td>
        <td><p-skeleton></p-skeleton></td>
      </tr>
    </ng-template>
  </p-table>
  } @else {
  <p-table [value]="projectService.projects()">
    <ng-template #caption>
      <div class="flex items-center justify-between">
        <span class="text-xl font-bold">Projects</span>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th>Project Name</th>
        <th>Status</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Progress</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-project>
      <tr class="hover:cursor-pointer hover:drop-shadow-lg">
        <td class="hover:underline" [routerLink]="['/projects', project.id]">
          <!-- <a > -->
          {{ project.name }}
          <!-- </a> -->
        </td>
        <td>
          <p-tag
            [value]="project.status.toUpperCase()"
            [severity]="this.projectService.getSeverity(project.status)"
          />
        </td>
        <td>{{ project.startDate }}</td>
        <td>{{ project.endDate }}</td>
        <td>
          <p-progressbar
            [value]="project.progress"
            [color]="this.projectService.getProgressColor(project.progress)"
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
  }
</section>
